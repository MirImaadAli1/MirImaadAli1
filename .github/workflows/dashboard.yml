name: Refresh e-ink dashboard
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-dashboard
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render public GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/dashboard.py
      - name: Save updated panels
        run: |
          git add assets/activity-*.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile dashboard'
          git push
